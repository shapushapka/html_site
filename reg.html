<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        form {
            text-align: center;
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border: 2px solid gray;       
            border-radius: 8px;           
            background-color: #f9f9f9;    
        }

        h2 {
            font-family: 'Montserrat', Arial, sans-serif;
            color: #333;
            margin-bottom: 20px;
        }

        p {
            margin: 15px 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <form id="forma" action="https://httpbin.org/post" method="POST">
        <h2>Регистрация</h2>
        
        <p>
            <label for="email">EMAIL</label><br>
            <input type="email" id="email" name="email" size="40" required>
        </p>
        
        <p>
            <label for="password">Пароль</label><br>
            <input type="password" id="password" name="password" size="40" required>
        </p>
        
        <p>
            <input type="checkbox" id="remember" name="agreement" value="yes">
            <label for="remember">Запомнить?</label>
        </p>
        
        <p>
            <input type="submit" value="Отправить">
        </p>
    </form>
</body>
</html>
